plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

if (System.getenv('BUILD_NUMBER') != null) {
    version += "." + System.getenv('BUILD_NUMBER')
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases/' }
    maven { name = 'Sponge Snapshots'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { name = 'JitPack'; url = 'https://jitpack.io' }
    maven { name = 'ModMaven'; url = 'https://modmaven.dev' }
}

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xmaxerrs' << '100000'
}

neoForge {
    version = project.neoforge_version
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources/').getAbsolutePath(), '--existing',
                    file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "com.github.alexthe666.citadel:citadel-26.2:2.7.5"
    implementation "net.neoforged:neoforge:${neoforge_version}"
    compileOnly "mezz.jei:jei-26.1.2-neoforge:29.5.0.26"
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title': 'alexsmobs',
                'Specification-Vendor': 'alexthe668',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': "${version}",
                'Implementation-Vendor': 'alexthe668'
        ])
    }
    reproducibleFileOrder = true
    preserveFileTimestamps = false
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version: project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neoforge_loader_version_range: project.neoforge_loader_version_range,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            license: project.license,
            version: project.version,
            mod_author: project.mod_author,
            description: project.description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/mcmodsrepo" }
    }
}

tasks.register('dumpCp') {
    doLast {
        configurations.compileClasspath.each { println it }
    }
}
