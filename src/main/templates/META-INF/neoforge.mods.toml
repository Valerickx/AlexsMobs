modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/Alex-the-666/AlexsMobs/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/alexs-mobs"
authors = "${mod_author}"
description = '''${description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "citadel"
type = "required"
versionRange = "[2.7.5,)"
ordering = "AFTER"
side = "BOTH"

[modproperties.${mod_id}]
catalogueItemIcon = "alexsmobs:bear_dust"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"
